async function sha(s){return new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)))}
async function dec(c,b){const d=Uint8Array.from(atob(b),x=>x.charCodeAt(0));const k=[];for(let i=0;k.length<d.length;i++){k.push(...await sha(c+i))}const t=new TextDecoder().decode(d.map((x,i)=>x^k[i]));return t.startsWith("OK|")?t.slice(3):null}
$("#go").onclick=async()=>{const c=$("#c").value.toUpperCase().replace(/\s/g,"");const o=$("#o");o.innerHTML="";if(!c)return;if(!window.crypto||!crypto.subtle){o.textContent="Abre o link em https.";return}for(const b of B){const t=await dec(c,b);if(t){o.innerHTML=t;return}}o.innerHTML="<p>Código inválido.</p>"};
