<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Calendário</title>
<style>
:root{--ink:#1C2230;--mute:#5F6571;--paper:#fff;--bg:#F4F5F7;--red:#B3261E}
@media (prefers-color-scheme:dark){:root{--ink:#E8EAEE;--mute:#A3A9B4;--paper:#1A1E26;--bg:#14171D;--red:#E5534B}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:'Segoe UI',Helvetica,Arial,sans-serif;padding:16px}
form{width:min(360px,100%);background:var(--paper);border:1.5px solid var(--ink);border-radius:12px;padding:24px;display:none;flex-direction:column;gap:12px}
form.show{display:flex}
h1{margin:0;font-size:24px}
p{margin:0;color:var(--mute);font-size:14px}
input,button{font:inherit;min-height:44px;border-radius:8px;border:1.5px solid var(--ink);padding:10px 12px}
input{background:var(--paper);color:var(--ink)}
label{display:flex;align-items:center;gap:8px;font-size:14px}
label input{min-height:0;width:18px;height:18px}
button{background:var(--ink);color:var(--paper);font-weight:700;cursor:pointer}
button:disabled{opacity:.5}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.err{color:var(--red);font-weight:700;font-size:14px;min-height:20px}
</style>
</head>
<body>
<form id="f">
  <h1>Calendário 2026/27</h1>
  <p>Introduz a palavra-passe para abrir.</p>
  <input type="password" id="pw" autocomplete="current-password" aria-label="Palavra-passe" required>
  <label><input type="checkbox" id="rem" checked>Manter sessão neste dispositivo</label>
  <button id="b">Entrar</button>
  <div class="err" id="e" role="alert"></div>
</form>

const WRAP="<!doctype html>\n"+document.documentElement.outerHTML;
const K="cal26-sessao-"+P.salt;
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64=b=>btoa(String.fromCharCode.apply(null,new Uint8Array(b)));
const store={get(){try{return localStorage.getItem(K)}catch(_){return null}},set(v){try{localStorage.setItem(K,v)}catch(_){}},del(){try{localStorage.removeItem(K)}catch(_){}}};
const LOGOUT='<button type="button" onclick="try{localStorage.removeItem(\''+K+'\')}catch(e){};location.reload()" style="position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:9999;font:600 13px Segoe UI,Helvetica,Arial,sans-serif;padding:8px 12px;min-height:36px;border-radius:999px;border:1.5px solid #1C2230;background:#fff;color:#1C2230;cursor:pointer">Terminar sessão</button>';
async function openWith(key){
  const src=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(P.iv)},key,ub(P.data)));
  window.__cal26={html:src,key:key,P:P,wrap:WRAP};
  const html=src.includes("</body>")?src.replace("</body>",LOGOUT+"</body>"):src+LOGOUT;
  document.open();document.write(html);document.close();
}
(async()=>{
  const saved=store.get();
  if(saved){
    try{await openWith(await crypto.subtle.importKey("raw",ub(saved),{name:"AES-GCM"},false,["encrypt","decrypt"]));return;}
    catch(_){store.del();}
  }
  document.getElementById("f").classList.add("show");
  document.getElementById("pw").focus();
})();
document.getElementById("f").addEventListener("submit",async ev=>{
  ev.preventDefault();
  const b=document.getElementById("b"),e=document.getElementById("e");
  b.disabled=true;b.textContent="A abrir…";e.textContent="";
  try{
    const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(document.getElementById("pw").value),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:ub(P.salt),iterations:P.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["encrypt","decrypt"]);
    await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(P.iv)},key,ub(P.data));
    if(document.getElementById("rem").checked) store.set(b64(await crypto.subtle.exportKey("raw",key)));
    await openWith(key);
  }catch(_){
    e.textContent="Palavra-passe incorreta.";b.disabled=false;b.textContent="Entrar";
  }
});
</script>
